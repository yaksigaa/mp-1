<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – FinLens</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #151f35 0%, #0a0e1a 70%);
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-header .logo-icon {
      font-size: 36px;
      display: inline-block;
      margin-bottom: 8px;
    }
    .auth-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .auth-header p {
      font-size: 13px;
      color: var(--text3);
      margin-top: 6px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 8px;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .auth-btn {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      margin-top: 8px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text3);
    }
    .auth-footer a {
      color: #a5b4fc;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <span class="logo-icon">💎</span>
      <h1>Create Account</h1>
      <p>Start tracking your financial anomalies with FinLens</p>
    </div>

    {% if error %}
    <div class="alert-banner error" style="margin-bottom: 20px;">
      ❌ {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/signup">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" value="{{ name or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" value="{{ email or '' }}" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat your password" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary auth-btn">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Login</a>
    </div>
  </div>
</body>
</html>
